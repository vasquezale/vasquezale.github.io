<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1200" role="img" aria-labelledby="title desc">
  <title id="title">SpecForge engineering validation workflow</title>
  <desc id="desc">A visual flow from oscilloscope measurements and LTspice simulation into a Python validation pipeline, deterministic gates, and a reviewable HTML report.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#e8f0f7"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fa8"/>
      <stop offset="1" stop-color="#58c7e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#11182f" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="960" height="1200" rx="0" fill="url(#paper)"/>
  <rect x="44" y="44" width="872" height="1112" rx="28" fill="#ffffff" stroke="#d7dee6"/>

  <g transform="translate(86 86)">
    <text x="0" y="0" fill="#2f6fa8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="2">SPECFORGE</text>
    <text x="0" y="54" fill="#14314a" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="850">Measured evidence</text>
    <text x="0" y="108" fill="#14314a" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="850">to reviewable report</text>
    <text x="0" y="162" fill="#66717f" font-family="Inter, Arial, sans-serif" font-size="24">Python automation for circuit test and simulation validation</text>
  </g>

  <g transform="translate(86 300)" filter="url(#shadow)">
    <rect x="0" y="0" width="360" height="170" rx="18" fill="#f5f8fb" stroke="#d7dee6"/>
    <text x="28" y="44" fill="#2f6fa8" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="850">Input A</text>
    <text x="28" y="86" fill="#14314a" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="850">Oscilloscope CSVs</text>
    <text x="28" y="124" fill="#66717f" font-family="Inter, Arial, sans-serif" font-size="21">11 measured points</text>
    <text x="28" y="154" fill="#66717f" font-family="Inter, Arial, sans-serif" font-size="21">100 Hz to 200 kHz</text>

    <rect x="428" y="0" width="360" height="170" rx="18" fill="#f5f8fb" stroke="#d7dee6"/>
    <text x="456" y="44" fill="#2f6fa8" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="850">Input B</text>
    <text x="456" y="86" fill="#14314a" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="850">LTspice export</text>
    <text x="456" y="124" fill="#66717f" font-family="Inter, Arial, sans-serif" font-size="21">251 simulation points</text>
    <text x="456" y="154" fill="#66717f" font-family="Inter, Arial, sans-serif" font-size="21">curated AC reference</text>
  </g>

  <g transform="translate(86 544)">
    <line x1="180" y1="-62" x2="360" y2="0" stroke="#9fc4ff" stroke-width="8" stroke-linecap="round"/>
    <line x1="608" y1="-62" x2="428" y2="0" stroke="#9fc4ff" stroke-width="8" stroke-linecap="round"/>
    <rect x="188" y="0" width="412" height="190" rx="24" fill="url(#blue)" filter="url(#shadow)"/>
    <text x="232" y="58" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="850">Python validation pipeline</text>
    <text x="232" y="104" fill="#eaf7ff" font-family="Inter, Arial, sans-serif" font-size="24">Compare measured vs simulated gain</text>
    <text x="232" y="142" fill="#eaf7ff" font-family="Inter, Arial, sans-serif" font-size="24">Check limits and preserve evidence</text>
  </g>

  <g transform="translate(86 800)" filter="url(#shadow)">
    <rect x="0" y="0" width="240" height="150" rx="18" fill="#11182f"/>
    <text x="28" y="42" fill="#58c7e8" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="850">Gate</text>
    <text x="28" y="86" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="850">Scoped PASS</text>
    <text x="28" y="122" fill="#c7d2e0" font-family="Inter, Arial, sans-serif" font-size="19">code owns pass/fail</text>

    <rect x="274" y="0" width="240" height="150" rx="18" fill="#f5f8fb" stroke="#d7dee6"/>
    <text x="302" y="42" fill="#b26b45" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="850">Review point</text>
    <text x="302" y="86" fill="#14314a" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="850">100 kHz</text>
    <text x="302" y="122" fill="#66717f" font-family="Inter, Arial, sans-serif" font-size="19">near 5 dB limit</text>

    <rect x="548" y="0" width="240" height="150" rx="18" fill="#f5f8fb" stroke="#d7dee6"/>
    <text x="576" y="42" fill="#2f6fa8" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="850">Output</text>
    <text x="576" y="86" fill="#14314a" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="850">HTML report</text>
    <text x="576" y="122" fill="#66717f" font-family="Inter, Arial, sans-serif" font-size="19">human review ready</text>
  </g>

  <g transform="translate(86 1016)">
    <rect x="0" y="0" width="788" height="84" rx="18" fill="#edf2f6" stroke="#d7dee6"/>
    <circle cx="42" cy="42" r="13" fill="#58c7e8"/>
    <text x="72" y="36" fill="#14314a" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="850">AI helps explain. Deterministic code validates.</text>
    <text x="72" y="64" fill="#66717f" font-family="Inter, Arial, sans-serif" font-size="19">Human judgment remains the engineering decision point.</text>
  </g>
</svg>
